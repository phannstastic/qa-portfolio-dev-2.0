<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin Authentication Portal for irfanLab">
  <title>Admin Login &bull; irfan.Lab</title>

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/favicon-32x32.png">

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Core & Admin Stylesheets -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">

  <div class="login-page-wrap">
    <div class="login-ambient-glow"></div>

    <div class="login-card">
      <div class="login-brand-header">
        <div class="login-logo-row">
          <a href="/" class="brand-logo" aria-label="Back to irfanLab">
            <span>irfan<span style="font-weight: 800;">Lab</span><span class="brand-dot">.</span></span>
            <span class="brand-badge">CMS</span>
          </a>
        </div>
        <h1 class="login-title">Admin Portal</h1>
        <p class="login-subtitle">Sign in to manage projects, work experiences, skills library, and messages.</p>
      </div>

      <!-- Feedback alert banner -->
      <div id="login-feedback" class="feedback-banner" role="alert" style="display: none;"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email" class="form-label">
            Email Address <span class="req">*</span>
          </label>
          <div class="input-icon-wrap">
            <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input
              type="email"
              id="login-email"
              class="form-input with-icon"
              placeholder="admin@example.com"
              required
              autocomplete="email"
              maxlength="191"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="login-password" class="form-label">
            Password <span class="req">*</span>
          </label>
          <div class="input-icon-wrap">
            <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              type="password"
              id="login-password"
              class="form-input with-icon"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
              maxlength="255"
            >
          </div>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-login">
          <span>Sign In to Dashboard</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <div class="login-footer-nav">
        <a href="/" class="login-back-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Back to irfanLab Portfolio</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Admin Script -->
  <script src="/js/admin.js"></script>
</body>
</html>

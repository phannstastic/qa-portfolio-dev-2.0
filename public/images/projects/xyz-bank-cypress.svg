<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCypress" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="cardCypress" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#061d15" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgCypress)" />

  <!-- Code lines background decoration -->
  <g stroke="#10b981" stroke-width="1" opacity="0.15">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="400" y1="0" x2="400" y2="450" />
  </g>

  <!-- Container Box -->
  <rect x="60" y="45" width="680" height="360" rx="12" fill="url(#cardCypress)" stroke="#059669" stroke-width="1.5" />

  <!-- Header -->
  <rect x="60" y="45" width="680" height="42" rx="12" fill="#032014" />
  <circle cx="90" cy="66" r="6" fill="#ef4444" />
  <circle cx="110" cy="66" r="6" fill="#f59e0b" />
  <circle cx="130" cy="66" r="6" fill="#10b981" />
  <text x="400" y="72" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Cypress Test Runner &bull; XyzBankTest.cy.js</text>

  <!-- Content -->
  <text x="100" y="140" fill="#ffffff" font-family="Outfit, Inter, sans-serif" font-size="24" font-weight="700">XYZ Bank E2E Automation</text>
  <text x="100" y="170" fill="#34d399" font-family="Inter, sans-serif" font-size="14" font-weight="600">Page Object Model (POM) Architecture &bull; 14 Automated Test Cases</text>

  <!-- Metrics Grid -->
  <rect x="100" y="195" width="180" height="90" rx="8" fill="#042f20" stroke="#059669" stroke-width="1" />
  <text x="120" y="225" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="12">MANAGER WORKFLOWS</text>
  <text x="120" y="260" fill="#34d399" font-family="Inter, sans-serif" font-size="20" font-weight="700">6 Scenarios (TC-01..06)</text>

  <rect x="300" y="195" width="180" height="90" rx="8" fill="#042f20" stroke="#059669" stroke-width="1" />
  <text x="320" y="225" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="12">CUSTOMER SUITE</text>
  <text x="320" y="260" fill="#34d399" font-family="Inter, sans-serif" font-size="20" font-weight="700">8 Scenarios (TC-01..08)</text>

  <rect x="500" y="195" width="180" height="90" rx="8" fill="#042f20" stroke="#059669" stroke-width="1" />
  <text x="520" y="225" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="12">AUTOMATION STATUS</text>
  <text x="520" y="260" fill="#10b981" font-family="Inter, sans-serif" font-size="20" font-weight="700">14 / 14 Passed (100%)</text>

  <!-- Cypress CLI line -->
  <rect x="100" y="315" width="580" height="50" rx="8" fill="#02140c" stroke="#047857" stroke-width="1" />
  <text x="125" y="345" fill="#34d399" font-family="monospace" font-size="13">&#10004;</text>
  <text x="150" y="345" fill="#e2e8f0" font-family="monospace" font-size="13">All specs passed! Add Customer, Currency Accounts, Deposits &amp; History</text>
</svg>

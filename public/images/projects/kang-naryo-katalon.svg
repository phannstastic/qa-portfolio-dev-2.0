<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Grid decoration -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Window Container -->
  <rect x="60" y="45" width="680" height="360" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.5))" />

  <!-- Window Header -->
  <rect x="60" y="45" width="680" height="42" rx="12" fill="#0f172a" />
  <circle cx="90" cy="66" r="6" fill="#ef4444" />
  <circle cx="110" cy="66" r="6" fill="#f59e0b" />
  <circle cx="130" cy="66" r="6" fill="#10b981" />
  <text x="400" y="72" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Katalon Studio &bull; Pondok Makan Kang Naryo Test Suite</text>

  <!-- Title & Badge -->
  <text x="100" y="140" fill="#f8fafc" font-family="Outfit, Inter, sans-serif" font-size="24" font-weight="700">Pondok Makan Kang Naryo</text>
  <text x="100" y="170" fill="#38bdf8" font-family="Inter, sans-serif" font-size="14" font-weight="600">Web Development &amp; Automated UI Testing</text>

  <!-- Test Summary Panel -->
  <rect x="100" y="200" width="180" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="120" y="230" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">MODULES TESTED</text>
  <text x="120" y="262" fill="#f8fafc" font-family="Inter, sans-serif" font-size="18" font-weight="700">Login, Cart, Menu</text>

  <rect x="300" y="200" width="180" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="320" y="230" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">TEST TOOL</text>
  <text x="320" y="262" fill="#10b981" font-family="Inter, sans-serif" font-size="18" font-weight="700">Katalon Studio</text>

  <rect x="500" y="200" width="180" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="520" y="230" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">BACKEND ENGINE</text>
  <text x="520" y="262" fill="#f43f5e" font-family="Inter, sans-serif" font-size="18" font-weight="700">Laravel &amp; MySQL</text>

  <!-- Console Log / Verification Pill -->
  <rect x="100" y="315" width="580" height="50" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1" />
  <text x="125" y="345" fill="#10b981" font-family="monospace" font-size="13">PASS</text>
  <text x="175" y="345" fill="#e2e8f0" font-family="monospace" font-size="13">Verification of user auth, food checkout flow &amp; admin CRUD complete</text>
</svg>

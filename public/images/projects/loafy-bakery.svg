<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLoafy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="cardLoafy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgLoafy)" />

  <g stroke="#d97706" stroke-width="0.8" opacity="0.2">
    <line x1="0" y1="110" x2="800" y2="110" />
    <line x1="0" y1="220" x2="800" y2="220" />
    <line x1="0" y1="330" x2="800" y2="330" />
    <line x1="250" y1="0" x2="250" y2="450" />
    <line x1="550" y1="0" x2="550" y2="450" />
  </g>

  <!-- Container Box -->
  <rect x="60" y="45" width="680" height="360" rx="12" fill="url(#cardLoafy)" stroke="#d97706" stroke-width="1.5" />

  <!-- Header -->
  <rect x="60" y="45" width="680" height="42" rx="12" fill="#201a15" />
  <circle cx="90" cy="66" r="6" fill="#ef4444" />
  <circle cx="110" cy="66" r="6" fill="#f59e0b" />
  <circle cx="130" cy="66" r="6" fill="#10b981" />
  <text x="400" y="72" fill="#fde68a" font-family="Inter, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Manual QA &bull; Loafy Bakery E-Commerce Test Matrix</text>

  <!-- Content -->
  <text x="100" y="140" fill="#ffffff" font-family="Outfit, Inter, sans-serif" font-size="24" font-weight="700">Loafy Bakery E-Commerce</text>
  <text x="100" y="170" fill="#fbbf24" font-family="Inter, sans-serif" font-size="14" font-weight="600">Manual Functional Testing &bull; Checkout &amp; Transaction Edge Cases</text>

  <!-- Metrics Grid -->
  <rect x="100" y="195" width="180" height="90" rx="8" fill="#451a03" stroke="#b45309" stroke-width="1" />
  <text x="120" y="225" fill="#fef3c7" font-family="Inter, sans-serif" font-size="12">CORE FLOWS TESTED</text>
  <text x="120" y="260" fill="#fbbf24" font-family="Inter, sans-serif" font-size="18" font-weight="700">Cart, Checkout, Stock</text>

  <rect x="300" y="195" width="180" height="90" rx="8" fill="#451a03" stroke="#b45309" stroke-width="1" />
  <text x="320" y="225" fill="#fef3c7" font-family="Inter, sans-serif" font-size="12">QA METHODOLOGY</text>
  <text x="320" y="260" fill="#fbbf24" font-family="Inter, sans-serif" font-size="18" font-weight="700">Manual &amp; Exploratory</text>

  <rect x="500" y="195" width="180" height="90" rx="8" fill="#451a03" stroke="#b45309" stroke-width="1" />
  <text x="520" y="225" fill="#fef3c7" font-family="Inter, sans-serif" font-size="12">TECH STACK</text>
  <text x="520" y="260" fill="#10b981" font-family="Inter, sans-serif" font-size="18" font-weight="700">PHP Native &amp; MySQL</text>

  <!-- Result Banner -->
  <rect x="100" y="315" width="580" height="50" rx="8" fill="#1c0f05" stroke="#78350f" stroke-width="1" />
  <text x="125" y="345" fill="#f59e0b" font-family="monospace" font-size="13">PASSED</text>
  <text x="190" y="345" fill="#fef3c7" font-family="monospace" font-size="13">Validated stock constraints, order status transitions &amp; cart calculations</text>
</svg>

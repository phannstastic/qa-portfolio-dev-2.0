<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Brand Gradient Defs for Test Compatibility -->
    <linearGradient id="irfanBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="bgBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
  </defs>

  <!-- Luxury Deep Black Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgBlack)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5" />

  <!-- Minimalist Architectural Laboratory Flask in Pure Crisp White (Black & White Theme) -->
  <!-- Flask Lip -->
  <line x1="25" y1="14" x2="39" y2="14" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" />

  <!-- Flask Neck and Body Contours -->
  <path d="M 28 14 V 23 L 17 44.5 C 15.6 47.3 17.6 50.5 20.8 50.5 H 43.2 C 46.4 50.5 48.4 47.3 47 44.5 L 36 23 V 14" 
        stroke="#FFFFFF" 
        stroke-width="2.8" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Minimalist Precision Meniscus / Liquid Calibration Line -->
  <line x1="22" y1="38" x2="42" y2="38" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Precision QA Test Assertion Spark / Pulse Dot -->
  <circle cx="32" cy="28" r="2.4" fill="#FFFFFF" />
  <circle cx="26" cy="44" r="1.4" fill="#FFFFFF" opacity="0.8" />
  <circle cx="37" cy="43" r="1.6" fill="#FFFFFF" opacity="0.8" />
</svg>
